[package]
name = "ghostty-vt-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
build = "build.rs"
links = "ghostty-vt"
publish = false

[lib]
doctest = false

[[bin]]
name = "gen-bindings"
path = "src/bin/gen_bindings.rs"
required-features = ["bindgen-tool"]

[features]
default = []
bindgen-tool = ["dep:bindgen", "dep:heck"]

[dependencies.bindgen]
version = "0.72"
optional = true

[dependencies.heck]
version = "0.5"
optional = true

[build-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(any(target_os = "macos", windows))'.build-dependencies.ureq]
version = "3"
features = ["native-tls-no-default"]
default-features = false

[target.'cfg(not(any(target_os = "macos", windows)))'.build-dependencies.ureq]
version = "3"
features = ["rustls", "platform-verifier"]
default-features = false
