[package]
name = "zhimaterm-recording"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "ZhimaTerm 会话留痕域：输出日志、记录门面与任务/操作历史"

[dependencies]
zhimaterm-base = { path = "../base" }
anyhow = "1"
chrono = "0.4"
gpui = { package = "gpui-pre", version = "=0.3.10" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
