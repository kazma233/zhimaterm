[package]
name = "zhimaterm-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "ZhimaTerm 运行时层：终端会话协议与传输、SFTP 任务、本地终端与会话留痕"

[dependencies]
zhimaterm-base = { path = "../base" }
zhimaterm-terminal = { path = "../terminal" }
anyhow = "1"
chrono = "0.4"
gpui = { package = "gpui-pre", version = "=0.3.10" }
libssh2-sys = "=0.3.3"
regex = "1"
serde_json = "=1.0.151"
smol = "2"
ssh2 = { version = "=0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[[bin]]
name = "zhimaterm-ssh-sftp-probe"
path = "src/bin/ssh_sftp_probe.rs"

[[bin]]
name = "zhimaterm-pty-probe"
path = "src/bin/pty_probe.rs"
