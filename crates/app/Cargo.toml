[package]
name = "zhimaterm-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Developer-focused desktop terminal with local and SSH shells, multi-tab sessions, and integrated SFTP"
license = "MIT"
default-run = "zhimaterm"

[dependencies]
zhimaterm-base = { path = "../base" }
zhimaterm-terminal = { path = "../terminal" }
zhimaterm-local = { path = "../local" }
zhimaterm-recording = { path = "../recording" }
zhimaterm-session = { path = "../session" }
zhimaterm-connections = { path = "../connections" }
anyhow = "1"
chrono = "0.4"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
regex = "1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSGeometry",
] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[[bin]]
name = "zhimaterm"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
productName = "ZhimaTerm"
version = "0.1.0"
identifier = "me.kazma.zhimaterm"
description = "Developer-focused desktop terminal with local and SSH shells, multi-tab sessions, and integrated SFTP"
publisher = "kazma"
category = "Utility"
outDir = "target/release"
binariesDir = "target/release"
icons = [
    "crates/app/icons/icon.icns",
    "crates/app/icons/icon.ico",
    "crates/app/icons/icon.png",
    "crates/app/icons/icon-1024.png",
]

[[package.metadata.packager.binaries]]
path = "zhimaterm"
main = true
