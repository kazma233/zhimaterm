[package]
name = "zhimaterm-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "ZhimaTerm 会话域：会话协议与内核、SSH 传输、SFTP 任务、重连与回滚"

[dependencies]
zhimaterm-base = { path = "../base" }
zhimaterm-terminal = { path = "../terminal" }
zhimaterm-local = { path = "../local" }
zhimaterm-recording = { path = "../recording" }
anyhow = "1"
chrono = "0.4"
libssh2-sys = "=0.3.3"
serde_json = "=1.0.151"
smol = "2"
ssh2 = { version = "=0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.5"

[target.'cfg(windows)'.dev-dependencies]
# perf 验收用例按父进程 id 数子进程、查句柄数（Toolhelp 快照 + 句柄计数）
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[[bin]]
name = "zhimaterm-ssh-sftp-probe"
path = "src/bin/ssh_sftp_probe.rs"
